# ruff check / ruff format, run by lint.sh. The scripts run on nixpkgs' Python 3.
line-length = 100
target-version = "py313"

[lint]
# pycodestyle, pyflakes, bugbear, import order, pyupgrade, bandit (security),
# simplify
select = ["E", "F", "W", "B", "I", "UP", "S", "SIM"]
ignore = [
  "E501", # long strings; ruff format handles code layout
  "S607", # `systemctl` etc. by name: the systemd units set PATH
]
