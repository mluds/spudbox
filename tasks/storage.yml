- name: Check if partitions exist
  ansible.builtin.shell: lsblk -no NAME | grep -q "{{ item.partition | basename }}"
  register: partition_check
  failed_when: false
  changed_when: false
  loop: "{{ cache_drives + storage_drives }}"

- name: Create partitions if they don't exist
  ansible.builtin.shell: |
    echo -e "g\nn\n1\n\n\nw" | fdisk {{ item.item.device }}
  when: item.rc != 0
  loop: "{{ partition_check.results }}"
  register: partition_created

- name: Inform kernel about partition table changes if partitions were created
  ansible.builtin.shell: partprobe {{ item.item.item.device }}
  when: partition_created.changed and item.changed
  loop: "{{ partition_created.results }}"

- name: Check if filesystems exist
  ansible.builtin.shell: blkid {{ item.partition }} -o value -s TYPE
  register: fs_check
  failed_when: false
  changed_when: false
  loop: "{{ cache_drives + storage_drives }}"

- name: Create XFS filesystem if it doesn't exist
  ansible.builtin.filesystem:
    fstype: xfs
    dev: "{{ item.item.partition }}"
  when: item.stdout == ""
  loop: "{{ fs_check.results }}"

- name: Create mount points for individual disks
  ansible.builtin.file:
    path: "{{ item.mount }}"
    state: directory
    mode: '0755'
  loop: "{{ cache_drives + storage_drives }}"

- name: Create mount point for merged filesystem
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ cache_dir }}"
    - "{{ storage_dir }}"

- name: Mount individual disks
  ansible.builtin.mount:
    path: "{{ item.mount }}"
    src: "{{ item.partition }}"
    fstype: xfs
    state: mounted
  loop: "{{ cache_drives + storage_drives }}"

- name: Install mergerfs package
  ansible.builtin.package:
    name: mergerfs
    state: present
    update_cache: yes

- name: Get a list of mounted disks for mergerfs cache
  ansible.builtin.set_fact:
    cache_paths: "{{ cache_drives | map(attribute='mount') | join(':') }}"

- name: Mount mergerfs cache filesystem
  ansible.builtin.mount:
    path: "{{ cache_dir }}"
    src: "{{ cache_paths }}"
    fstype: "fuse.mergerfs"
    opts: "defaults,allow_other,use_ino,cache.files=partial,dropcacheonclose=true,category.create=mfs,fsname=mergerfs"
    state: mounted

- name: Get a list of mounted disks for mergerfs storage
  ansible.builtin.set_fact:
    storage_paths: "{{ storage_drives | map(attribute='mount') | join(':') }}"

- name: Mount mergerfs storage filesystem
  ansible.builtin.mount:
    path: "{{ storage_dir }}"
    src: "{{ storage_paths }}"
    fstype: "fuse.mergerfs"
    opts: "defaults,allow_other,use_ino,cache.files=partial,dropcacheonclose=true,category.create=mfs,fsname=mergerfs"
    state: mounted

- name: Use hdparm to have HDDs go into standby after 5 minutes
  copy:
    dest: /etc/udev/rules.d/69-hdparm.rules
    content: 'ACTION=="add|change", KERNEL=="sd[a-z]", ATTR{queue/rotational}=="1", RUN+="/sbin/hdparm -S 60 -B 127 /dev/%k"'
    owner: root
    group: root
    mode: '0644'
  register: udev_rule

- name: Reload udev rules
  command: udevadm control --reload-rules
  when: udev_rule.changed

- name: Apply udev rules
  command: udevadm trigger
  when: udev_rule.changed
