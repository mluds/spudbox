- name: Create users for Docker services
  user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    system: no
    shell: /usr/sbin/nologin
    create_home: no
    state: present
  loop:
    - uid: "{{ sabnzbd_uid }}"
      name: sabnzbd
    - uid: "{{ radarr_uid }}"
      name: radarr
    - uid: "{{ sonarr_uid }}"
      name: sonarr
    - uid: "{{ bazarr_uid }}"
      name: bazarr
    - uid: "{{ plex_uid }}"
      name: plex
    - uid: "{{ overseerr_uid }}"
      name: overseerr
    - uid: "{{ qbittorrent_uid }}"
      name: qbittorrent
    - uid: "{{ caddy_uid }}"
      name: caddy
    - uid: "{{ homeassistant_uid }}"
      name: homeassistant
    - uid: "{{ zwavejs_uid }}"
      name: zwavejs
    - uid: "{{ homepage_uid }}"
      name: homepage
    - uid: "{{ aria2_uid }}"
      name: aria2
    - uid: "{{ ariang_uid }}"
      name: ariang

- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Create Docker keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.gpg
    mode: '0644'

- name: Dearmor Docker GPG key
  shell: gpg --dearmor < /tmp/docker.gpg > /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Set Docker GPG key permissions
  file:
    path: /etc/apt/keyrings/docker.gpg
    mode: '0644'

- name: Set Docker architecture variable
  set_fact:
    docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else ('amd64' if ansible_architecture == 'x86_64' else 'amd64') }}"

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

- name: Install Docker
  package:
    name:
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce
    state: present
    update_cache: yes

- name: Configure Docker
  template:
    src: docker/daemon.json
    dest: /etc/docker/daemon.json
    mode: '0600'
  notify: restart docker

- name: Create docker group
  group:
    name: docker
    state: present

- name: Add user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: Create docker-compose directory
  file:
    path: /opt/docker
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Get Docker group ID
  ansible.builtin.command: getent group docker
  register: docker_group_info
  changed_when: false

- name: Extract Docker group ID
  ansible.builtin.set_fact:
    docker_gid: "{{ docker_group_info.stdout.split(':')[2] }}"

- name: Create docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: /opt/docker/docker-compose.yml
    owner: "{{ ansible_user }}"
    mode: '0644'
  notify: update compose

- name: Start Docker service
  service:
    name: docker
    state: started
    enabled: yes

- meta: flush_handlers
