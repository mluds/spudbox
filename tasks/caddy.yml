- name: Generate bcrypt hash using Ansible
  set_fact:
    admin_password_hash: "{{ admin_password | password_hash('bcrypt') }}"
  no_log: true

- name: Configure Caddy Dockerfile
  template:
    src: caddy/Dockerfile
    dest: /mnt/storage/appdata/caddy/Dockerfile
    mode: '0644'
  notify: update compose

- name: Configure Caddyfile
  template:
    src: caddy/caddyfile.j2
    dest: /mnt/storage/appdata/caddy/conf/Caddyfile
    mode: '0644'
  notify: restart caddy