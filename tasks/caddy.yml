- name: Generate bcrypt hash for admin password
  set_fact:
    admin_password_hash: "{{ admin_password | password_hash('bcrypt', 'FixedSaltValue12345678') }}"
  no_log: true

- name: Configure Caddy Dockerfile
  template:
    src: caddy/Dockerfile
    dest: "{{ appdata_dir }}/caddy/Dockerfile"
    mode: '0644'
  notify: update compose

- name: Configure Caddyfile
  template:
    src: caddy/caddyfile.j2
    dest: "{{ appdata_dir }}/caddy/conf/Caddyfile"
    mode: '0644'
  notify: restart caddy