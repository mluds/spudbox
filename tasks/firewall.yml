- name: Ensure UFW is installed
  ansible.builtin.package:
    name: ufw
    state: present

- name: Set default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: incoming
    state: enabled

- name: Set default outgoing policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing
    state: enabled

- name: Open UFW ports from multiple CIDRs
  community.general.ufw:
    rule: allow
    port: "{{ item.0.port }}"
    proto: "{{ item.0.proto }}"
    from_ip: "{{ item.1 }}"
    state: enabled
  loop: "{{ ports_to_open | product(allowed_cidrs) | list }}"
  vars:
    allowed_cidrs:
      - "{{ lan_cidr }}"
      - "{{ wireguard_cidr }}"
    ports_to_open:
      - port: '22'
        proto: tcp
      - port: '80'
        proto: tcp
      - port: '443'
        proto: tcp
      - port: '443'
        proto: udp
      - port: '21064:21100'  # HA HomeKit port range
        proto: tcp

- name: Allow wireguard traffic
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp
    state: enabled

- name: Allow port 8123 from Docker networks
  community.general.ufw:
    rule: allow
    port: '8123'
    proto: tcp
    from_ip: "{{ item }}"
    state: enabled
  loop: "{{ docker_cidrs }}"

- name: Allow all traffic from localhost
  community.general.ufw:
    rule: allow
    src: 127.0.0.1
    state: enabled

- name: Enable UFW
  community.general.ufw:
    state: enabled