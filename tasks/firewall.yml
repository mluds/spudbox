- name: Ensure UFW is installed
  ansible.builtin.package:
    name: ufw
    state: present

- name: Set default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: incoming
    state: enabled

- name: Set default outgoing policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing
    state: enabled

- name: Open UFW ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ lan_cidr }}"
    state: enabled
  loop:
    - port: '22'
      proto: tcp
    - port: '80'
      proto: tcp
    - port: '443'
      proto: tcp
    - port: '443'
      proto: udp

- name: Allow all traffic from localhost
  community.general.ufw:
    rule: allow
    src: 127.0.0.1
    state: enabled

- name: Enable UFW
  community.general.ufw:
    state: enabled