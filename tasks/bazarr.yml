- name: Check if Bazarr first startup is ready
  wait_for:
    port: "{{ bazarr_port }}"
    host: 127.0.0.1
    delay: 1
    timeout: 120

- name: Generate MD5 hash of admin_password
  set_fact:
    admin_password_md5: "{{ admin_password | hash('md5') }}"

- name: Read existing YAML file
  ansible.builtin.slurp:
    src: /mnt/storage/appdata/bazarr/config/config.yaml
  register: config_content

- name: Parse YAML content
  set_fact:
    config_yaml: "{{ config_content.content | b64decode | from_yaml }}"

- name: Update YAML content
  set_fact:
    config_yaml: "{{ config_yaml | combine(updated_values, recursive=True) }}"
  vars:
    updated_values:
      general:
        enabled_providers:
          - opensubtitlescom
          - assrt
        serie_default_enabled: true
        serie_default_profile: 1
        movie_default_enabled: true
        movie_default_profile: 1
        parse_embedded_audio_track: false
        use_embedded_subs: false
        chmod: '0660'
        chmod_enabled: true
        use_radarr: true
        use_sonarr: true
        subzero_mods: remove_tags,remove_HI
      auth:
        type: form
        username: "{{ admin_username }}"
        password: "{{ admin_password_md5 }}"
        apikey: "{{ bazarr_api_key }}"
      radarr:
        ip: radarr
        port: "{{ radarr_port }}"
        apikey: "{{ radarr_api_key }}"
      sonarr:
        ip: sonarr
        port: "{{ sonarr_port }}"
        apikey: "{{ sonarr_api_key }}"
      opensubtitlescom:
        username: "{{ opensubtitles_username }}"
        password: "{{ opensubtitles_password }}"
        include_ai_translated: false
        use_hash: true
      assrt:
        token: "{{ assrt_api_token }}"

- name: Write updated YAML back to file
  ansible.builtin.copy:
    dest: /mnt/storage/appdata/bazarr/config/config.yaml
    content: "{{ config_yaml | to_nice_yaml(indent=2) }}"
  notify: restart bazarr

- name: Check if language profile exists
  ansible.builtin.shell: |
    sqlite3 /mnt/storage/appdata/bazarr/db/bazarr.db "SELECT COUNT(*) FROM table_languages_profiles WHERE name='Default';"
  register: profile_exists
  changed_when: false
  args:
    executable: /bin/bash

- name: Add language profile if it doesn't exist
  ansible.builtin.shell: |
    sqlite3 /mnt/storage/appdata/bazarr/db/bazarr.db "INSERT INTO table_languages_profiles (\"profileId\", cutoff, \"originalFormat\", items, name, \"mustContain\", \"mustNotContain\", tag) VALUES (1, NULL, 0, '[{\"id\": 1, \"language\": \"en\", \"audio_exclude\": \"False\", \"hi\": \"False\", \"forced\": \"False\"}, {\"id\": 2, \"language\": \"zh\", \"audio_exclude\": \"False\", \"hi\": \"False\", \"forced\": \"False\"}]', 'Default', '[]', '[]', NULL);"
  args:
    executable: /bin/bash
  when: profile_exists.stdout == "0"
  notify: restart bazarr