- name: stop tautulli
  community.docker.docker_compose_v2:
    project_src: /opt/docker
    services:
      - tautulli
    state: stopped

- name: Configure Tautulli
  template:
    src: tautulli/config.ini.j2
    dest: "{{ appdata_dir }}/tautulli/config.ini"
    owner: "{{ tautulli_uid }}"
    mode: '0644'

- name: start tautulli
  community.docker.docker_compose_v2:
    project_src: /opt/docker
    services:
      - tautulli
    state: present

- debug: msg={{ admin_password | pbkdf2_hash }}
