- name: Set Radarr auth method
  xml:
    path: /mnt/storage/appdata/radarr/config.xml
    xpath: /Config/AuthenticationMethod
    value: External
  notify: restart radarr

- name: Set Radarr API key
  xml:
    path: /mnt/storage/appdata/radarr/config.xml
    xpath: /Config/ApiKey
    value: "{{ radarr_api_key }}"
  notify: restart radarr

- meta: flush_handlers

- name: Check if Radarr is ready
  wait_for:
    port: "{{ radarr_port }}"
    host: 127.0.0.1
    delay: 1
    timeout: 120

- name: Add root folder to Radarr
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ radarr_port }}/api/v3/rootfolder"
    method: POST
    body_format: json
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    body: |
      {
        "name": "Movies",
        "path": "/data/media/movies"
      }
    status_code: [201, 400]
  register: radarr_rootfolder_result
  failed_when: 
    - radarr_rootfolder_result.status != 201 
    - not (radarr_rootfolder_result.json is defined and radarr_rootfolder_result.json | selectattr('errorMessage', 'defined') | selectattr('errorMessage', 'search', 'already configured') | list | length > 0)
  changed_when: radarr_rootfolder_result.status == 201

- name: Add NZBGeek as indexer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ radarr_port }}/api/v3/indexer"
    method: POST
    body_format: json
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    body: |
      {
        "name": "NZBGeek",
        "implementationName": "Newznab",
        "implementation": "Newznab",
        "configContract": "NewznabSettings",
        "enable": true,
        "protocol": "usenet",
        "enableRss": true,
        "enableAutomaticSearch": true,
        "enableInteractiveSearch": true,
        "supportsRss": true,
        "supportsSearch": true,
        "fields": [
          { "name": "baseUrl", "value": "https://api.nzbgeek.info/" },
          { "name": "apiPath", "value": "/api" },
          { "name": "apiKey", "value": "{{ nzbgeek_api_key }}" },
          { "name": "categories", "value": [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060] }
        ]
      }
    status_code: [201, 400]
  register: nzbgeek_add_result
  failed_when: 
    - nzbgeek_add_result.status != 201 
    - not (nzbgeek_add_result.json is defined and nzbgeek_add_result.json | selectattr('errorMessage', 'defined') | selectattr('errorMessage', 'search', 'Should be unique') | list | length > 0)
  changed_when: nzbgeek_add_result.status == 201

- name: Add SABnzbd as download client
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ radarr_port }}/api/v3/downloadclient"
    method: POST
    body_format: json
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    body: |
      {
        "name": "SABnzbd",
        "enable": true,
        "protocol": "usenet",
        "priority": 1,
        "removeCompletedDownloads": true,
        "removeFailedDownloads": true,
        "implementationName": "Sabnzbd",
        "implementation": "Sabnzbd",
        "configContract": "SabnzbdSettings",
        "fields": [
          { "name": "host", "value": "sabnzbd" },
          { "name": "port", "value": {{ sabnzbd_port }} },
          { "name": "apiKey", "value": "{{ sabnzbd_api_key }}" },
          { "name": "useSsl", "value": false },
          { "name": "category", "value": "movies" },
          { "name": "recentTvPriority", "value": 0 },
          { "name": "olderTvPriority", "value": 0 }
        ]
      }
    status_code: [201, 400]
  register: sabnzbd_add_result
  failed_when: 
    - sabnzbd_add_result.status != 201 
    - not (sabnzbd_add_result.json is defined and sabnzbd_add_result.json | selectattr('errorMessage', 'defined') | selectattr('errorMessage', 'search', 'Should be unique') | list | length > 0)
  changed_when: sabnzbd_add_result.status == 201

- name: Get Radarr quality definitions
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ radarr_port }}/api/v3/qualitydefinition"
    method: GET
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    status_code: 200
    return_content: yes
  register: quality_definitions

- name: Update size values for each quality definition
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ radarr_port }}/api/v3/qualitydefinition/{{ item.id }}"
    method: PUT
    body_format: json
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    body: "{{ item | combine({
      'minSize': quality_size_values[item.quality.name].minSize | default(item.minSize),
      'maxSize': quality_size_values[item.quality.name].maxSize | default(item.maxSize),
      'preferredSize': quality_size_values[item.quality.name].preferredSize | default(item.preferredSize)
      }) }}"
    status_code: 202
  register: update_result
  loop: "{{ quality_definitions.json }}"
  when: item.quality.name in quality_size_values
  changed_when: >
    update_result.status == 202 and 
    (item.minSize != (quality_size_values[item.quality.name].minSize | default(item.minSize)) or
     item.maxSize != (quality_size_values[item.quality.name].maxSize | default(item.maxSize)) or
     item.preferredSize != (quality_size_values[item.quality.name].preferredSize | default(item.preferredSize)))