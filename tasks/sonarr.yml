- name: Check if Sonarr first startup is ready
  wait_for:
    port: "{{ sonarr_port }}"
    host: 127.0.0.1
    delay: 1
    timeout: 120

- name: Config Sonarr
  xml:
    path: /mnt/storage/appdata/sonarr/config.xml
    xpath: "{{ item.xpath }}"
    value: "{{ item.value }}"
  notify: restart sonarr
  loop:
    - xpath: /Config/AuthenticationMethod
      value: Forms
    - xpath: /Config/Authentication/Username
      value: "{{ admin_username }}"
    - xpath: /Config/Authentication/Password
      value: "{{ admin_password }}"
    - xpath: /Config/ApiKey
      value: "{{ sonarr_api_key }}"

- meta: flush_handlers

- name: Check if Sonarr is ready
  uri:
    url: "http://127.0.0.1:{{ sonarr_port }}/login"
    method: GET
    status_code: 200
  register: result
  until: result.status == 200
  retries: 60
  delay: 2
  failed_when: false

- name: Add root folder to Sonarr
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/rootfolder"
    method: POST
    body_format: json
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body: |
      {
        "name": "TV",
        "path": "/data/media/tv"
      }
    status_code: [201, 400]
  register: sonarr_rootfolder_result
  failed_when: 
    - sonarr_rootfolder_result.status != 201 
    - not (sonarr_rootfolder_result.json is defined and sonarr_rootfolder_result.json | selectattr('errorMessage', 'defined') | selectattr('errorMessage', 'search', 'already configured') | list | length > 0)
  changed_when: sonarr_rootfolder_result.status == 201

- name: Add NZBGeek as indexer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/indexer"
    method: POST
    body_format: json
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body: |
      {
        "name": "NZBGeek",
        "implementationName": "Newznab",
        "implementation": "Newznab",
        "configContract": "NewznabSettings",
        "enable": true,
        "protocol": "usenet",
        "enableRss": true,
        "enableAutomaticSearch": true,
        "enableInteractiveSearch": true,
        "supportsRss": true,
        "supportsSearch": true,
        "fields": [
          { "name": "baseUrl", "value": "https://api.nzbgeek.info/" },
          { "name": "apiPath", "value": "/api" },
          { "name": "apiKey", "value": "{{ nzbgeek_api_key }}" },
          { "name": "categories", "value": [5020, 5030, 5040, 5045] },
          { "name": "animeCategories", "value": [5070] },
          { "name": "animeStandardFormatSearch", "value": true }
        ]
      }
    status_code: [201, 400]
  register: nzbgeek_add_result
  failed_when: 
    - nzbgeek_add_result.status != 201 
    - not (nzbgeek_add_result.json is defined and nzbgeek_add_result.json | selectattr('errorMessage', 'defined') | selectattr('errorMessage', 'search', 'Should be unique') | list | length > 0)
  changed_when: nzbgeek_add_result.status == 201

- name: Add SABnzbd as download client
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/downloadclient"
    method: POST
    body_format: json
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body: |
      {
        "name": "SABnzbd",
        "enable": true,
        "protocol": "usenet",
        "priority": 1,
        "removeCompletedDownloads": true,
        "removeFailedDownloads": true,
        "implementationName": "Sabnzbd",
        "implementation": "Sabnzbd",
        "configContract": "SabnzbdSettings",
        "fields": [
          { "name": "host", "value": "sabnzbd" },
          { "name": "port", "value": {{ sabnzbd_port }} },
          { "name": "apiKey", "value": "{{ sabnzbd_api_key }}" },
          { "name": "useSsl", "value": false },
          { "name": "category", "value": "tv" },
          { "name": "recentTvPriority", "value": 0 },
          { "name": "olderTvPriority", "value": 0 }
        ]
      }
    status_code: [201, 400]
  register: sabnzbd_add_result
  failed_when: 
    - sabnzbd_add_result.status != 201 
    - not (sabnzbd_add_result.json is defined and sabnzbd_add_result.json | selectattr('errorMessage', 'defined') | selectattr('errorMessage', 'search', 'Should be unique') | list | length > 0)
  changed_when: sabnzbd_add_result.status == 201

- name: Get Sonarr quality definitions
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/qualitydefinition"
    method: GET
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    status_code: 200
    return_content: yes
  register: quality_definitions

- name: Update size values for each quality definition
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/qualitydefinition/{{ item.id }}"
    method: PUT
    body_format: json
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body: "{{ item | combine({
      'minSize': quality_size_values[item.quality.name].minSize | default(item.minSize),
      'maxSize': quality_size_values[item.quality.name].maxSize | default(item.maxSize),
      'preferredSize': quality_size_values[item.quality.name].preferredSize | default(item.preferredSize)
      }) }}"
    status_code: 202
  register: update_result
  loop: "{{ quality_definitions.json }}"
  when: item.quality.name in quality_size_values
  changed_when: >
    update_result.status == 202 and 
    (item.minSize != (quality_size_values[item.quality.name].minSize | default(item.minSize)) or
     item.maxSize != (quality_size_values[item.quality.name].maxSize | default(item.maxSize)) or
     item.preferredSize != (quality_size_values[item.quality.name].preferredSize | default(item.preferredSize)))

- name: Load profile settings
  set_fact:
    any_profile: "{{ lookup('file', 'files/any_profile.json') }}"

- name: Apply updated profile to Sonarr
  uri:
    url: "http://127.0.0.1:{{ sonarr_port }}/api/v3/qualityprofile/{{ any_profile.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body: "{{ any_profile | to_json }}"
    body_format: json
    status_code: 202