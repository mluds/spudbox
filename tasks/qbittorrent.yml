- name: Check if qBittorrent config file would change
  template:
    src: templates/qbittorrent.conf.j2
    dest: /mnt/storage/appdata/qbittorrent/qBittorrent/qBittorrent.conf
    owner: "{{ qbittorrent_uid }}"
    mode: '0644'
  register: qbittorrent_config_check
  check_mode: yes

- name: Stop qBittorrent container
  community.docker.docker_compose_v2:
    project_src: /opt/docker
    services:
      - qbittorrent
    state: stopped
  when: qbittorrent_config_check.changed

- name: Create qBittorrent config file
  template:
    src: templates/qbittorrent.conf.j2
    dest: /mnt/storage/appdata/qbittorrent/qBittorrent/qBittorrent.conf
    owner: "{{ qbittorrent_uid }}"
    mode: '0644'
  when: qbittorrent_config_check.changed

- name: Start qBittorrent container
  community.docker.docker_compose_v2:
    project_src: /opt/docker
    services:
      - qbittorrent
    state: restarted
  when: qbittorrent_config_check.changed