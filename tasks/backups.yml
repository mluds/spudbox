- name: Install restic
  apt:
    name:
      - restic
    state: present

- name: Check if autorestic is already installed
  command: which autorestic
  register: autorestic_check
  ignore_errors: true
  changed_when: false

- name: Download and install autorestic
  shell: |
    curl -s https://raw.githubusercontent.com/cupcakearmy/autorestic/master/install.sh | bash -s -- --install-dir /usr/local/bin
  args:
    warn: false
  when: autorestic_check.rc != 0

- name: Configure autorestic
  template:
    src: backups/autorestic.yml.j2
    dest: "{{ appdata_dir }}/autorestic/config.yml"
    mode: '0644'

- name: Setup autorestic systemd service
  template:
    src: backups/autorestic.service.j2
    dest: "/etc/systemd/system/autorestic.service"
    mode: '0644'

- name: Setup autorestic systemd timer
  template:
    src: backups/autorestic.timer.j2
    dest: "/etc/systemd/system/autorestic.timer"
    mode: '0644'
