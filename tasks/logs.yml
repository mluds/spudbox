- name: Configure journald to store logs in memory
  lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: 'Storage=volatile'
  notify: restart journald

- name: Set journald memory usage limit
  lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?RuntimeMaxUse='
    line: 'RuntimeMaxUse=50M'
  notify: restart journald

- name: Check if daemon.json exists
  stat:
    path: /etc/docker/daemon.json
  register: daemon_json_stat

- name: Read existing daemon.json if it exists
  slurp:
    src: /etc/docker/daemon.json
  register: existing_daemon_json
  when: daemon_json_stat.stat.exists

- name: Set docker config facts when file exists
  set_fact:
    docker_config: "{{ existing_daemon_json.content | b64decode | from_json }}"
  when: daemon_json_stat.stat.exists

- name: Set docker config facts when file doesn't exist
  set_fact:
    docker_config: {}
  when: not daemon_json_stat.stat.exists

- name: Update docker config with log settings
  set_fact:
    docker_config: "{{ docker_config | combine({'log-driver': 'journald', 'log-opts': {}}) }}"

- name: Write updated daemon.json
  copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_config | to_nice_json }}"
    mode: '0644'
  notify: restart docker
