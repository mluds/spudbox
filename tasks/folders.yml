- name: Create media group with specific GID
  ansible.builtin.group:
    name: media
    gid: "{{ media_gid }}"
    state: present

- name: Create media directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0775'
    owner: "{{ ansible_user }}"
    group: media
  loop:
    - /mnt/storage/data/media/movies
    - /mnt/storage/data/media/tv
    - /mnt/storage/data/usenet/complete/movies
    - /mnt/storage/data/usenet/complete/tv
    - /mnt/storage/data/usenet/incomplete/movies
    - /mnt/storage/data/usenet/incomplete/tv
    - /mnt/storage/data/torrents/complete/movies
    - /mnt/storage/data/torrents/complete/tv
    - /mnt/storage/data/torrents/incomplete/movies
    - /mnt/storage/data/torrents/incomplete/tv

- name: Create appdata directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
    owner: "{{ item.uid }}"
    group: "{{ item.gid | default(item.uid) }}"
  loop:
    - path: '/mnt/storage/appdata/sabnzbd'
      uid: "{{ sabnzbd_uid }}"
    - path: '/mnt/storage/appdata/radarr'
      uid: "{{ radarr_uid }}"
    - path: '/mnt/storage/appdata/sonarr'
      uid: "{{ sonarr_uid }}"
    - path: '/mnt/storage/appdata/plex'
      uid: "{{ plex_uid }}"
      gid: "{{ media_gid }}"
    - path: '/mnt/storage/appdata/overseerr'
      uid: "{{ overseerr_uid }}"
    - path: '/mnt/storage/appdata/qbittorrent/qBittorrent'
      uid: "{{ qbittorrent_uid }}"
    - path: /mnt/storage/appdata/caddy/conf
      uid: '{{ caddy_uid }}'
    - path: /mnt/storage/appdata/caddy/data
      uid: '{{ caddy_uid }}'
    - path: /mnt/storage/appdata/homeassistant
      uid: '{{ homeassistant_uid }}'
    - path: /mnt/storage/appdata/zwavejs
      uid: '{{ zwavejs_uid }}'
    - path: /mnt/storage/appdata/homepage
      uid: '{{ homepage_uid }}'