- name: Create media group with specific GID
  ansible.builtin.group:
    name: media
    gid: "{{ media_gid }}"
    state: present

- name: Create media directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0775'
    owner: "{{ ansible_user }}"
    group: media
    recurse: yes
  loop:
    - "{{ storage_dir }}/data/media/movies"
    - "{{ storage_dir }}/data/media/tv"
    - "{{ storage_dir }}/data/misc"
    - "{{ cache_dir }}/data/usenet/complete/movies"
    - "{{ cache_dir }}/data/usenet/complete/tv"
    - "{{ cache_dir }}/data/usenet/incomplete/movies"
    - "{{ cache_dir }}/data/usenet/incomplete/tv"
    - "{{ cache_dir }}/data/torrents/complete/movies"
    - "{{ cache_dir }}/data/torrents/complete/tv"
    - "{{ cache_dir }}/data/torrents/incomplete/movies"
    - "{{ cache_dir }}/data/torrents/incomplete/tv"
    - "{{ cache_dir }}/data/downloads"

- name: Create appdata directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
    owner: "{{ item.uid }}"
    group: "{{ item.gid | default(item.uid) }}"
    recurse: yes
  loop:
    - path: '{{ appdata_dir }}/sabnzbd'
      uid: "{{ sabnzbd_uid }}"
    - path: '{{ appdata_dir }}/radarr'
      uid: "{{ radarr_uid }}"
    - path: '{{ appdata_dir }}/sonarr'
      uid: "{{ sonarr_uid }}"
    - path: '{{ appdata_dir }}/bazarr'
      uid: '{{ bazarr_uid }}'
    - path: '{{ appdata_dir }}/plex'
      uid: "{{ plex_uid }}"
      gid: "{{ media_gid }}"
    - path: '{{ appdata_dir }}/overseerr'
      uid: "{{ overseerr_uid }}"
    - path: '{{ appdata_dir }}/qbittorrent/qBittorrent'
      uid: "{{ qbittorrent_uid }}"
    - path: '{{ appdata_dir }}/caddy/conf'
      uid: '{{ caddy_uid }}'
    - path: '{{ appdata_dir }}/caddy/data'
      uid: '{{ caddy_uid }}'
    - path: '{{ appdata_dir }}/homeassistant'
      uid: '{{ homeassistant_uid }}'
    - path: '{{ appdata_dir }}/zwavejs'
      uid: '{{ zwavejs_uid }}'
    - path: '{{ appdata_dir }}/homepage'
      uid: '{{ homepage_uid }}'
    - path: '{{ appdata_dir }}/aria2/config'
      uid: '{{ aria2_uid }}'
    - path: '{{ appdata_dir }}/stash/config'
      uid: '{{ stash_uid }}'
    - path: '{{ appdata_dir }}/stash/metadata'
      uid: '{{ stash_uid }}'
    - path: '{{ appdata_dir }}/stash/cache'
      uid: '{{ stash_uid }}'
    - path: '{{ appdata_dir }}/stash/blobs'
      uid: '{{ stash_uid }}'
    - path: '{{ appdata_dir }}/stash/generated'
      uid: '{{ stash_uid }}'
