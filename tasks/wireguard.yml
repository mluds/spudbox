- name: Install WireGuard
  apt:
    name:
      - wireguard
      - qrencode
    state: present
    update_cache: yes

- name: Create WireGuard config directory
  file:
    path: /etc/wireguard
    state: directory
    mode: '0700'

- name: Generate WireGuard private key
  shell: wg genkey | tee /etc/wireguard/privatekey | wg pubkey > /etc/wireguard/publickey
  args:
    creates: /etc/wireguard/privatekey

- name: Set permissions on WireGuard keys
  file:
    path: "{{ item }}"
    mode: '0600'
  loop:
    - /etc/wireguard/privatekey
    - /etc/wireguard/publickey

- name: Read WireGuard server private key
  slurp:
    src: /etc/wireguard/privatekey
  register: wireguard_server_private_key_slurp

- set_fact:
    wireguard_server_private_key: "{{ wireguard_server_private_key_slurp.content | b64decode | trim }}"

- name: Read WireGuard server public key
  slurp:
    src: /etc/wireguard/publickey
  register: wireguard_server_public_key_slurp

- set_fact:
    wireguard_server_public_key: "{{ wireguard_server_public_key_slurp.content | b64decode | trim }}"

- name: Create empty list for updated clients
  set_fact:
    updated_clients: []

- name: Add address field to each client
  set_fact:
    updated_clients: "{{ updated_clients + [item.1 | combine({'ip': wireguard_network_base + '.' + ((item.0 + 2) | string)})] }}"
  with_indexed_items: "{{ wireguard_clients }}"

- name: Add address field to each client
  set_fact:
    wireguard_clients: "{{ updated_clients }}"

- name: Ensure WireGuard client keys directories exist
  file:
    path: /etc/wireguard/clients/{{ item.name }}
    state: directory
    mode: '0700'
  loop: "{{ updated_clients }}"

- name: Generate WireGuard keys for each client
  shell: |
    wg genkey | tee /etc/wireguard/clients/{{ item.name }}/privatekey | wg pubkey > /etc/wireguard/clients/{{ item.name }}/publickey
  args:
    creates: /etc/wireguard/clients/{{ item.name }}/privatekey
  loop: "{{ updated_clients }}"
  register: key_generation

- name: Update permissions on client private keys
  file:
    path: /etc/wireguard/clients/{{ item.name }}/privatekey
    mode: '0600'
  loop: "{{ updated_clients }}"

- name: Update permissions on client public keys
  file:
    path: /etc/wireguard/clients/{{ item.name }}/publickey
    mode: '0600'
  loop: "{{ updated_clients }}"

- name: Read generated private keys
  slurp:
    src: /etc/wireguard/clients/{{ item.name }}/privatekey
  loop: "{{ updated_clients }}"
  register: private_keys
  become: yes

- name: Read generated public keys
  slurp:
    src: /etc/wireguard/clients/{{ item.name }}/publickey
  loop: "{{ updated_clients }}"
  register: public_keys
  become: yes

- name: Reset wireguard_clients variable
  set_fact:
    wireguard_clients: []

- name: Update each client with their unique keys  
  set_fact:
    wireguard_clients: "{{ wireguard_clients + [client_with_keys] }}"
  vars:
    client_with_keys: "{{
      item.0 | combine({
        'private_key': item.1.content | b64decode | trim,
        'public_key': item.2.content | b64decode | trim
      })
    }}"
  loop: "{{ updated_clients | zip(private_keys.results, public_keys.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"

- debug: var=wireguard_clients

- name: Create WireGuard server config
  template:
    src: wireguard/server.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'

- name: Create WireGuard client configs
  template:
    src: wireguard/client.conf.j2
    dest: /etc/wireguard/clients/{{ item.name }}/client.conf
    owner: root
    group: root
    mode: '0600'
  loop: "{{ wireguard_clients }}"

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Enable and start WireGuard
  systemd:
    name: wg-quick@wg0
    state: started
    enabled: yes