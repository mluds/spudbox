- name: Create SABnzbd appdata directory
  file:
    path: /mnt/storage/appdata/sabnzbd
    state: directory
    owner: "{{ sabnzbd_user }}"
    mode: '0755'

- name: Create SABnzbd config file
  template:
    src: templates/sabnzbd.ini.j2
    dest: /mnt/storage/appdata/sabnzbd/sabnzbd.ini
    owner: "{{ sabnzbd_user }}"
    mode: '0644'

- name: Restart SABnzbd container using docker-compose
  community.docker.docker_compose_v2:
    project_src: /opt/docker
    services:
      - sabnzbd
    state: restarted