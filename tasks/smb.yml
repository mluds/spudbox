---
- name: Install Samba
  apt:
    name:
      - samba
      - samba-common
    state: present
    update_cache: yes

- name: Create Samba user
  shell: |
    (echo "password"; echo "password") | smbpasswd -a {{ ansible_user }}
  ignore_errors: yes

- name: Create samba config backup
  copy:
    src: /etc/samba/smb.conf
    dest: /etc/samba/smb.conf.bak
    remote_src: yes
    force: no

- name: Configure Samba
  template:
    src: templates/smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'

- name: Enable and restart Samba services
  service:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - smbd
    - nmbd