---
- name: Configure Ubuntu server
  hosts: spudbox
  become: true
  vars:
    mergerfs_mount_point: /mnt/storage
    source_drives:
      - /mnt/disk1
      - /mnt/disk2
      - /mnt/disk3
    smb_share_path: "{{ mergerfs_mount_point }}/shares"
    wireguard_port: 51820
    wireguard_address: "10.0.0.1/24"
    home_assistant_directory: /opt/homeassistant

  tasks:
  - name: Import Docker setup tasks
    import_tasks: tasks/docker_setup.yml

  - name: Import MergerFS setup tasks
    import_tasks: tasks/mergerfs_setup.yml

  - name: Import Home Assistant VM setup tasks
    import_tasks: tasks/home_assistant_setup.yml

  - name: Import SMB setup tasks
    import_tasks: tasks/smb_setup.yml

  - name: Import WireGuard setup tasks
    import_tasks: tasks/wireguard_setup.yml