name: update-lock

# Daily: move flake.lock to the newest spudbox module (with its nixpkgs,
# Plex, Caddy and Homebridge updates), if this instance still evaluates with it. With
# spudbox.autoUpdate, the server deploys it that night.
on:
  schedule:
    - cron: "47 7 * * *" # about 3 am in New York, after the module's update
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-lock

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Update the spudbox input
        id: update
        run: |
          echo "old=$(jq -r .nodes.spudbox.locked.rev flake.lock)" >> "$GITHUB_OUTPUT"
          nix flake update spudbox
          echo "new=$(jq -r .nodes.spudbox.locked.rev flake.lock)" >> "$GITHUB_OUTPUT"
      # secrets/ stays encrypted here; evaluating doesn't read it.
      - name: Evaluate this instance
        if: steps.update.outputs.old != steps.update.outputs.new
        run: nix eval --raw .#nixosConfigurations.default.config.system.build.toplevel.drvPath
      - name: Commit
        if: steps.update.outputs.old != steps.update.outputs.new
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.update.outputs.old }}
          NEW: ${{ steps.update.outputs.new }}
        run: |
          module=$(jq -r '.nodes.spudbox.locked | "\(.owner)/\(.repo)"' flake.lock)
          {
            echo "flake.lock: spudbox module ${NEW:0:7}"
            echo
            gh api "repos/$module/compare/$OLD...$NEW" --jq '.commits[].commit.message | split("\n")[0] | "- \(.)"' || true
          } > "$RUNNER_TEMP/message"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$RUNNER_TEMP/message" flake.lock
          git push origin HEAD
