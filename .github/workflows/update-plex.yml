name: update-plex

# Daily: move services/plex.json to the newest Plex release
# (scripts/update-plex.sh). The bump is committed to the update-plex branch,
# gets the same checks as any push (check.yml), and main fast-forwards to it
# only if they pass. Instances pick it up with their flake.lock.
on:
  schedule:
    - cron: "17 6 * * *" # about 1 am in New York
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-plex

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Bump services/plex.json
        id: bump
        run: echo "version=$(./scripts/update-plex.sh)" >> "$GITHUB_OUTPUT"
      - name: Commit to the update-plex branch
        id: commit
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Plex $VERSION"
          git push --force origin HEAD:refs/heads/update-plex
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: bump
    if: needs.bump.outputs.sha != ''
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  merge:
    needs: [bump, check]
    runs-on: ubuntu-latest
    steps:
      # Through the API, which refuses anything but a fast-forward (and needs
      # no checkout): if main moved meanwhile, this fails and tomorrow's run
      # bumps the new main.
      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$SHA" -F force=false
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/update-plex"
