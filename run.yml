- name: Configure Ubuntu server
  hosts: all
  become: yes
  handlers:
    - import_tasks: handlers/misc.yml
    - import_tasks: handlers/docker.yml
  tasks:
    - import_tasks: tasks/sudo.yml
    - import_tasks: tasks/ssh.yml
    - import_tasks: tasks/upgrade.yml
    - import_tasks: tasks/ansible.yml
    - import_tasks: tasks/mergerfs.yml
    - import_tasks: tasks/folders.yml
    - import_tasks: tasks/firewall.yml
    - import_tasks: tasks/caddy.yml
    - import_tasks: tasks/docker.yml
    - import_tasks: tasks/sabnzbd.yml
    - import_tasks: tasks/radarr.yml
    - import_tasks: tasks/sonarr.yml
    - import_tasks: tasks/overseerr.yml
    - import_tasks: tasks/qbittorrent.yml
    - import_tasks: tasks/zwavejs.yml
      when: zwavejs_enabled | bool
    - import_tasks: tasks/homeassistant.yml
    - import_tasks: tasks/homepage.yml
    - import_tasks: tasks/wireguard.yml
